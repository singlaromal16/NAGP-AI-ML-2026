<!DOCTYPE html>
<html>
<head>
    <title>Travel Planning Assistant</title>
    <style>
        body {
            font-family: Arial;
            max-width: 800px;
            margin: 40px auto;
            background: #f5f5f5;
        }

        h2 {
            text-align: center;
        }

        #chat {
            background: white;
            padding: 20px;
            min-height: 400px;
            border-radius: 10px;
        }

        .user {
            color: #1565c0;
            margin: 15px 0;
        }

        .ai {
            color: #222;
            background: #eee;
            padding: 12px;
            border-radius: 8px;
            white-space: pre-wrap;
            margin-bottom: 20px;
        }

        .input {
            display: flex;
            margin-top: 15px;
        }

        input {
            flex: 1;
            padding: 12px;
            font-size: 16px;
        }

        button {
            padding: 12px 20px;
            background: #1565c0;
            color: white;
            border: 0;
            cursor: pointer;
        }
    </style>
</head>

<body>

<h2>Travel Planning Assistant</h2>

<div id="chat"></div>

<div class="input">
    <input id="question" placeholder="Question" />
    <button onclick="ask()">Send</button>
</div>

<script>
async function ask() {
    const input = document.getElementById("question");
    const chat = document.getElementById("chat");
    const question = input.value.trim();
    if (!question) return;
    chat.innerHTML += `
        <div class="user">
            <b>You:</b> ${question}
        </div>
    `;

    input.value = "";

    chat.innerHTML += `
        <div class="ai" id="loading">
            Thinking...
        </div>
    `;

    try {

        const response = await fetch("/ask", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                question: question
            })
        });

        const data = await response.json();
        document.getElementById("loading").innerHTML =
            data.answer;

    } catch (error) {
        document.getElementById("loading").innerHTML =
            "Error connecting to the Python server.";
    }
}
</script>
</body>
</html>
